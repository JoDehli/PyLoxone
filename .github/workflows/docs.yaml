name: Docs

on:
  push:
    branches: [master]
    paths:
      - "site-docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "BLUEPRINTS.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs gh-deploy --force
