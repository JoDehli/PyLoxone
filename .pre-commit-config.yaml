# Local pre-commit hooks. Install once with:  pre-commit install
#
# Ruff version is pinned to the one in requirements-dev.txt and in CI, so the
# hooks and the CI lint agree.
#
# The lint rule set is a RATCHET: it only lists rule families that are already
# clean in the whole tree. Add a family here once its existing violations are
# fixed, never before. The full `select = ALL` pass from ruff.toml stays advisory.
#
# No ruff-format hook yet: formatting the tree would rewrite lines in open PRs
# and cause merge conflicts. Add it after the open PRs are merged, together with
# a one-off format commit listed in .git-blame-ignore-revs.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--select, "E9,PLE,S307"]
