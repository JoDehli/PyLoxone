[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `online` tests need a reachable Miniserver and are deselected by default:
#   pytest -m online      runs only those
# Coverage is reported (summary only) but not enforced.
addopts =
    -m "not online"
    --cov=custom_components/loxone
    --cov-report=term

# The Home Assistant test harness (pytest-homeassistant-custom-component)
# registers async autouse fixtures; they need asyncio_mode = auto, and so do
# bare `async def test_*` functions.
asyncio_mode = auto

markers =
    online: requires a reachable Miniserver (deselected by default)
